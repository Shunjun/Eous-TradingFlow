services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eous_tradingflow}
      POSTGRES_USER: ${POSTGRES_USER:-eous}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eous_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  server:
    build:
      context: .
      target: server-runner
    environment:
      DATABASE_URL: ${APP_DATABASE_URL:-postgresql://${POSTGRES_USER:-eous}:${POSTGRES_PASSWORD:-eous_password}@postgres:5432/${POSTGRES_DB:-eous_tradingflow}?schema=public}
      REDIS_URL: ${APP_REDIS_URL:-redis://redis:6379}
      PORT: 3020
      INITIAL_USER_EMAIL: ${INITIAL_USER_EMAIL:-admin@eous.dev}
      INITIAL_USER_PASSWORD: ${INITIAL_USER_PASSWORD:-changeme}
      ALLOW_SELF_REGISTRATION: ${ALLOW_SELF_REGISTRATION:-true}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      EOUS_PROVIDER_PROXY_URL: ${EOUS_PROVIDER_PROXY_URL:-}
      PATTERN_GRPC_URL: pattern-service:50051
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pattern-service:
        condition: service_started
    command:
      [
        'sh',
        '-c',
        'pnpm --filter @eous/db db:deploy && pnpm exec node --import tsx apps/server/src/index.ts',
      ]
    expose:
      - '3020'
    restart: unless-stopped

  pattern-service:
    build:
      context: .
      dockerfile: services/pattern-service/Dockerfile
    environment:
      PATTERN_GRPC_HOST: 0.0.0.0
      PATTERN_GRPC_PORT: 50051
    expose:
      - '50051'
    restart: unless-stopped

  web:
    build:
      context: .
      target: web-runner
    depends_on:
      - server
    ports:
      - '${WEB_PORT:-5173}:80'
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
